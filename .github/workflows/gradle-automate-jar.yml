name: Build PR Artifact
on:
  pull_request:
    branches: [ master ] # Run when there is a PR to master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Check and smoke-test release JAR (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew clean check releaseSmokeTest

      - name: Check and smoke-test release JAR (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean check releaseSmokeTest

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-app-${{ runner.os }}
          path: build/libs/*.jar # Path where Gradle outputs your JAR
