name: MarkBind Action

on:
  push:
    branches:
      - master
      - markbind

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Graphviz
        run: sudo apt-get install graphviz
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: Build and deploy MarkBind site
        uses: MarkBind/markbind-action@v2.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rootDirectory: './docs'
          baseUrl: '/CS3227-2610-MP2'
          version: '6.0.2'
